    if(file instanceof File&&file.size){
      if(file.size>64000)return error('原型只支持 64 KB 以内的 Markdown 文件。');
      try{body=(await file.text()).trim();}catch{return error('无法读取这个文件，请重新选择。');}
      if(catalogAction!==action||!catalogDialog.open)return;
      name=file.name.replace(/\.(md|markdown)$/i,'');
    }
    if(!body)return error('请选择文件或粘贴 Markdown。');
    name=body.match(/^#\s+(.+)$/m)?.[1]?.trim()||name||'markdown-skill';
    desc='从 Markdown 导入的演示 Skill。';sourceLabel='Markdown · 本次演示';
  }
  if(!name||name.length>64)return error('Skill 名称必须为 1–64 个字符。');
  if(projectSkills().some(item=>item!==skill&&item.name===name&&item.origin===(skill?.origin??'Atelier 安装')))return error('这个来源在当前项目中已有同名 Skill。');
  if(skill){Object.assign(skill,{name,desc,body,version:(skill.version??1)+1});}
  else projectSkills().unshift({id:`app:demo:${++demoSkillSerial}`,name,desc,body,sourceLabel,origin:'Atelier 安装',policy:'manual',icon:'spark'});
  if(!skill){projectSearch='';projectFilter='all';}
  catalogDialog.close();renderMain(false);notify(skill?'已保存演示 Skill':'已添加到当前演示项目');
});
function renderDrawer(){
  const key=focusKey();
  document.querySelector('#drawer-context').textContent=`${project} / ${session().name}`;
  const rows=effectiveCatalog();
  const enabled=rows.filter(skill=>skill.policy!=='off').length, auto=rows.filter(skill=>skill.policy==='auto').length;
  drawerBody.innerHTML=`<div class="drawer-controls"><label><span id="drawer-session-label">会话</span><select aria-labelledby="drawer-session-label" data-change="drawer-session" ${attr('drawer-session')}>${options(projects[project].sessions.map(item=>[item.id,item.name]),sessionId)}</select></label><label><span id="drawer-mode-label">模拟运行模式</span><select aria-labelledby="drawer-mode-label" data-change="mode" ${attr('mode')}>${options([['native','本机信任'],['controlled','受控模式']],native()?'native':'controlled')}</select></label></div>
  ${state.runs[sessionId]?.active?`<p class="notice">${icon('info')} 当前运行仍使用启动时的配置。要立即停止，返回会话后点「停止模拟运行」。</p>`:''}
  <div class="section-head"><div class="section-title"><h2>下一次新运行 ${tag(`可用 ${enabled} 项`,'on')}</h2><p>允许自动调用 ${auto} 项。会话只能缩小上层范围。</p></div></div>
  ${[['project','项目 Skills'],['host','本机继承']].map(([source,title])=>`<div class="drawer-group"><h3>${title}</h3><div class="surface list">${rows.filter(skill=>skill.source===source).map(skill=>{
    const overrideChoices=[['follow','跟随上层'],['off','停用此项'],...(skill.upperPolicy==='auto'||skill.override==='manual'?[['manual','仅手动']]:[])];
    return `<div class="skill-row"><div class="skill-ident"><span class="mark">${icon(skill.icon)}</span><div class="skill-id"><p class="skill-name">${text(skill.name)}</p><p class="skill-desc">${skill.origin} · ${labels[skill.policy]}</p><p class="result">${skill.reason}</p></div></div><select data-change="override" data-id="${skill.id}" ${attr('drawer:'+skill.id)} aria-label="${text(skill.name)}（${skill.origin}）的会话用法" ${skill.upperPolicy==='off'?'disabled':''}>${options(skill.upperPolicy==='off'?[['follow','不可覆盖']]:overrideChoices,skill.override)}</select></div>`;
  }).join('')}</div></div>`).join('')}`;
  refocus(key);
}
function renderChat(){
  const rows=effectiveCatalog(), available=rows.filter(skill=>skill.policy!=='off');
  const run=state.runs[sessionId];
  const picked=available.find(skill=>skill.id===state.picked[sessionId])?.id??'';
  app.innerHTML=`<header class="heading"><div><p class="eyebrow">CONVERSATION</p><h1>${session().name}</h1><p class="lead">${project} · ${native()?'本机信任':'受控模式'}</p></div><button class="btn" data-action="extensions" ${attr('back-extensions')}>${icon('puzzle')} 返回扩展</button></header>
  <div class="surface conversation"><p class="bubble">用我们已有的工具，帮我检查这个页面。</p><p class="reply">这个会话用来预览 Skill 设置对下一次运行的影响。不会调用真实模型，也不会操作任何网页。</p>
  ${run?`<p class="run-receipt">${tag(run.active?'模拟运行中':'模拟运行已停止',run.active?'on':'outline')} <strong>启动时可用 ${run.count} 项。</strong> ${run.skill?`模拟${run.manual?'手动':'自动'}调用：<code>${text(run.skill.name)}</code> · ${run.skill.origin}`:'没有模拟调用任何 Skill。'}</p>`:''}</div>
  <div class="surface composer"><p class="composer-line">在下方选择要手动调用的 Skill，或直接模拟发送。</p><div class="composer-actions"><button class="btn" data-action="session" ${attr('session-trigger')}>${icon('spark')} 本会话 Skills ${tag(`${available.length} 项`,'outline')}</button><div class="composer-buttons"><button class="btn primary" data-action="${run?.active?'stop-run':'start-run'}" ${attr('run-trigger')}>${icon(run?.active?'x':'arrow')} ${run?.active?'停止模拟运行':'模拟新运行'}</button></div></div>
  <div class="manual-pick"><label for="manual-picker">手动指定</label><select id="manual-picker" data-change="manual-picker" aria-label="手动指定 Skill" ${run?.active?'disabled':''}>${options([['','未指定'],...available.map(skill=>[skill.id,`${skill.name} · ${skill.origin}`])],picked)}</select></div></div>`;
}
function changeProject(next){if(!projects[next]||next===project)return;project=next;sessionId=projects[project].sessions[0].id;}
function openDrawer(button){returnFocus=button;document.querySelector('#drawer-feedback').textContent='';renderDrawer();dialog.showModal();}
dialog.addEventListener('close',()=>{if(returnFocus?.isConnected)returnFocus.focus();else document.querySelector('[data-focus="session-trigger"]')?.focus();});
document.addEventListener('click',event=>{
  const button=event.target.closest('button[data-action]');if(!button||button.disabled)return;
  const {action,id}=button.dataset;
  switch(action){
    case 'extensions':page='extensions';renderMain();break;
    case 'chat':page='chat';renderMain();break;
    case 'open-chat':sessionId=id;page='chat';renderMain();break;
    case 'scope':scope=id;renderMain();break;
    case 'catalog':openCatalog(button.dataset.kind,id,button);break;
    case 'close-catalog':catalogDialog.close();break;
    case 'card-switch':case 'card-auto':{
      const skill=projectSkills().find(item=>item.id===id);if(!skill)return;
      if(action==='card-switch'){
        if(skill.policy==='off')skill.policy=skill.previousPolicy??'manual';
        else {skill.previousPolicy=skill.policy;skill.policy='off';}
      }else if(skill.policy!=='off')skill.policy=skill.policy==='auto'?'manual':'auto';
      renderMain();
      if(!document.querySelector(`[data-focus="${CSS.escape(button.dataset.focus)}"]`))document.querySelector('#project-filter')?.focus();
      notify('已保存演示项目设置');break;
    }
    case 'toggle-global':state.enabled=!state.enabled;renderMain();notify(state.enabled?'全局继承已开启 · 下一次新运行生效':'全局继承已关闭 · 下一次新运行生效');break;
    case 'session':openDrawer(button);break;
    case 'close-session':dialog.close();break;
    case 'discover':state.newItem=true;filter='';renderMain(false);document.querySelector('#global-search')?.focus();notify('发现 readme-check，未自动启用');break;
    case 'reset':state=seed();filter='';projectSearch='';projectFilter='all';project='my-deeptutor';sessionId='web-a';renderMain();notify('已恢复原型默认设置');break;
    case 'start-run':{
      const rows=effectiveCatalog(), pick=rows.find(skill=>skill.policy!=='off'&&skill.id===state.picked[sessionId]);
      const skill=pick??rows.find(skill=>skill.policy==='auto');
      state.runs[sessionId]={active:true,count:rows.filter(skill=>skill.policy!=='off').length,skill,manual:Boolean(pick)};
      renderMain();notify('模拟运行已启动，保存了本轮的 Skill 配置');break;
    }
    case 'stop-run':if(state.runs[sessionId])state.runs[sessionId].active=false;renderMain();notify('模拟运行已停止');break;
  }
});
document.addEventListener('change',event=>{
  const el=event.target;if(!(el instanceof HTMLSelectElement)||el.disabled)return;
  const {change,id}=el.dataset;
  switch(change){
    case 'project':changeProject(el.value);projectSearch='';projectFilter='all';renderMain();break;
    case 'project-filter':projectFilter=el.value;projectRows();break;
    case 'global-policy':if(!state.enabled||!catalog().some(item=>item.id===id))return;state.policies[id]=el.value;renderMain();notify('已保存全局用法 · 下一次新运行生效');break;
    case 'project-policy':state.blocked[project]=el.value==='block';renderMain();notify('已保存项目设置 · 下一次新运行生效');break;
    case 'drawer-session':if(!projects[project].sessions.some(item=>item.id===el.value))return;sessionId=el.value;document.querySelector('#drawer-feedback').textContent='';renderMain(false);renderDrawer();break;
    case 'mode':state.modes[sessionId]=el.value;renderMain(false);renderDrawer();notify('已切换模拟模式');break;
    case 'override':(state.overrides[sessionId]??={})[id]=el.value;renderMain(false);renderDrawer();notify('已保存会话覆盖');break;
    case 'manual-picker':state.picked[sessionId]=el.value;break;
  }
});
document.addEventListener('input',event=>{
  if(event.target.id==='global-search'){filter=event.target.value;globalRows();}
  if(event.target.id==='project-search'){projectSearch=event.target.value;projectRows();}
});
document.addEventListener('keydown',event=>{
  if(!event.target.closest('[role="tab"]')||!['ArrowLeft','ArrowRight','Home','End'].includes(event.key))return;
  event.preventDefault();scope=event.key==='Home'?'project':event.key==='End'?'global':scope==='global'?'project':'global';renderMain(false);refocus(scope+'-tab');
});
renderMain(false);
</script>
</body>
</html>
