name: Dependency checks

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux x64 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor-profiles bubblewrap
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
            [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi
          # The command sandbox maps /lib64 to /usr/lib on Arch.
          if [[ ! -e /usr/lib/ld-linux-x86-64.so.2 ]]; then
            test -f /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2
            sudo ln -s /usr/lib/x86_64-linux-gnu/ld-linux-x86-64.so.2 /usr/lib/ld-linux-x86-64.so.2
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check types and source boundaries
        run: npm run check

      - name: Run runtime and browser tests
        run: |
          ATELIER_TEST_CHROMIUM="$(command -v google-chrome)"
          export ATELIER_TEST_CHROMIUM
          test -x "$ATELIER_TEST_CHROMIUM"
          test -x /usr/bin/python3
          node --import tsx --input-type=module -e '
            import { commandsAvailable } from "./server/commands.ts";
            if (!commandsAvailable()) throw new Error("bubblewrap command sandbox is unavailable");
          '
          npm test

      - name: Build frontend and desktop
        run: |
          npm run build
          npm run build:desktop
