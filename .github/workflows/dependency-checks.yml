name: Dependency checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Linux x64 checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24.21.0"
          cache: npm

      - name: Install Linux test tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y apparmor-profiles bubblewrap xvfb xauth
          if [[ -r /proc/sys/kernel/apparmor_restrict_unprivileged_userns ]] &&
            [[ "$(cat /proc/sys/kernel/apparmor_restrict_unprivileged_userns)" == "1" ]]; then
            sudo apparmor_parser -r /usr/share/apparmor/extra-profiles/bwrap-userns-restrict
          fi

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Check formatting
        run: npm run format:check

      - name: Check types and source boundaries
        run: npm run check

      - name: Run runtime and browser tests
        run: |
          ATELIER_TEST_CHROMIUM="$(command -v google-chrome)"
          export ATELIER_TEST_CHROMIUM
          test -x "$ATELIER_TEST_CHROMIUM"
          test -x /usr/bin/python3
          node --import tsx --input-type=module -e '
            import { commandsAvailable } from "./server/commands.ts";
            if (!commandsAvailable()) throw new Error("bubblewrap command sandbox is unavailable");
          '
          npm test

      - name: Build frontend and desktop
        run: |
          npm run build
          npm run build:desktop

      - name: Verify Terminal in an isolated Electron window
        env:
          ATELIER_TERMINAL_EVIDENCE: ${{ runner.temp }}/terminal-evidence
        run: |
          node node_modules/electron/install.js
          xvfb-run -a node --import tsx scripts/smoke-terminal.mts

      - name: Preserve Terminal screenshots and receipts
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: terminal-electron-${{ github.run_attempt }}
          path: ${{ runner.temp }}/terminal-evidence/
          if-no-files-found: ignore
          retention-days: 7
